<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Панель керування | ОСББ «Синевирій»</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f8fb;
        color: #132845;
      }
      #login-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .login-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(19, 40, 69, 0.08);
        width: 100%;
        max-width: 440px;
        padding: 40px 35px;
        text-align: center;
      }
      .login-logo {
        display: inline-block;
        background: #edf4fa;
        color: #2b6cb0;
        width: 64px;
        height: 64px;
        line-height: 64px;
        border-radius: 50%;
        font-size: 28px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
        color: #1e4e8c;
      }
      p.subtitle {
        font-size: 14px;
        color: #667;
        margin: 0 0 25px;
        line-height: 1.5;
      }
      .form-group {
        text-align: left;
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #334;
      }
      input[type="password"], input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        border: 1px solid #d0dbe5;
        border-radius: 8px;
        background: #fafcff;
        color: #132845;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus {
        border-color: #2b6cb0;
        background: #fff;
      }
      button.btn-login {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        background-color: #2b6cb0;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      button.btn-login:hover {
        background-color: #1e4e8c;
      }
      .login-help {
        margin-top: 20px;
        font-size: 12px;
        color: #778;
        line-height: 1.5;
      }
      .login-help a {
        color: #2b6cb0;
        text-decoration: none;
      }
      .login-help a:hover {
        text-decoration: underline;
      }
      #logout-btn {
        display: none;
        position: fixed;
        bottom: 15px;
        right: 15px;
        z-index: 99999;
        background: rgba(19, 40, 69, 0.85);
        color: #fff;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }
      #logout-btn:hover {
        background: #d32f2f;
      }
    </style>
  </head>
  <body>
    <div id="login-screen">
      <div class="login-card">
        <div class="login-logo">🌲</div>
        <h1>ОСББ «Синевирій»</h1>
        <p class="subtitle">Панель керування контентом сайту</p>

        <form id="token-form">
          <div class="form-group">
            <label for="gh-token">GitHub Access Token:</label>
            <input
              type="password"
              id="gh-token"
              placeholder="github_pat_... або ghp_..."
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn-login">Увійти в адмінку →</button>
        </form>

        <div class="login-help">
          Токен зберігається лише у вашому браузері (localStorage) і використовується для прямого збереження змін у репозиторій <b>Gunkov/synevyr</b>.
        </div>
      </div>
    </div>

    <button id="logout-btn" title="Вийти з адмінки">🚪 Вийти</button>

    <script>
      function getSavedUser() {
        try {
          const d = localStorage.getItem('decap-cms-user') || localStorage.getItem('netlify-cms-user');
          if (d) {
            const u = JSON.parse(d);
            if (u && u.token) return u;
          }
        } catch (e) {}
        return null;
      }

      function startCMS() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'block';

        if (!window.CMS) {
          const script = document.createElement('script');
          script.src = 'https://unpkg.com/decap-cms@^3.1.10/dist/decap-cms.js';
          script.onload = () => {
            if (window.CMS) {
              window.CMS.registerLocale('uk', {
                auth: { login: 'Увійти', loggingIn: 'Вхід...', errors: { badCredentials: 'Невірний токен' } },
                app: { header: { content: 'Контент', media: 'Медіафайли', quickAdd: 'Швидке додавання' } }
              });
            }
          };
          document.body.appendChild(script);
        }
      }

      const form = document.getElementById('token-form');
      const tokenInput = document.getElementById('gh-token');
      const logoutBtn = document.getElementById('logout-btn');

      // Check existing session
      const saved = getSavedUser();
      if (saved) {
        startCMS();
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const token = tokenInput.value.trim();
        if (token) {
          const payload = JSON.stringify({ token: token, backendName: 'github' });
          localStorage.setItem('decap-cms-user', payload);
          localStorage.setItem('netlify-cms-user', payload);
          startCMS();
        }
      });

      logoutBtn.addEventListener('click', function () {
        if (confirm('Вийти з панелі керування?')) {
          localStorage.removeItem('decap-cms-user');
          localStorage.removeItem('netlify-cms-user');
          window.location.reload();
        }
      });
    </script>
  </body>
</html>
